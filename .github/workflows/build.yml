name: Build & Release APK

# Gera o APK sem PC: abra a aba Actions do repositorio no celular, escolha
# "Build & Release APK" -> Run workflow. O APK sai na pagina Releases.
on:
  push:
    branches:
      - main
      - "ccr-a2405c87-7ky8d7"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android project structure
        # flutter create num diretorio temporario + copia so a pasta android/
        # (mesma abordagem do Gondolas e do Risca) e ajusta nome/permissoes.
        run: ./tool/preparar_android.sh

      - name: Restore signing key (optional)
        # Com o secret DEBUG_KEYSTORE_BASE64 cadastrado, todo build sai com a
        # MESMA assinatura e o APK novo atualiza o antigo por cima. Sem o
        # secret o build funciona igual, mas a assinatura muda a cada build
        # ("App nao foi instalado" ao atualizar: desinstale e instale de novo).
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Assinatura fixa restaurada."
          else
            echo "Sem DEBUG_KEYSTORE_BASE64: assinatura nova neste build."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify SQL
        run: python3 tool/verify_sql.py

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etiquetas-camda-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Etiquetas CAMDA #${{ github.run_number }}"
          body: |
            ## Etiquetas CAMDA

            Imprime etiquetas ZPL direto na Zebra por Bluetooth classico (SPP).

            **Primeiro uso:** pareie a Zebra em Configuracoes do Android > Bluetooth, abra o app,
            toque em "Escolher a Zebra" e depois em "Imprimir etiqueta de teste".

            **Build:** #${{ github.run_number }} | Branch: `${{ github.ref_name }}`
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
