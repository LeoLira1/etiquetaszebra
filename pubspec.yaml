name: etiquetas_camda
description: Etiquetas CAMDA - fila de etiquetas que imprime direto na Zebra por Bluetooth classico (SPP)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Bluetooth CLASSICO (SPP/RFCOMM) so no Android - e o que a Zebra fala. Nao e BLE.
  # Lista os pareados, conecta no UUID SPP 00001101 e envia bytes brutos (ZPL).
  flutter_bluetooth_classic_serial: 1.3.2
  libsql_dart: ^0.9.0
  permission_handler: ^12.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# Icone do app: os PNGs saem de `python3 tool/gerar_icone.py` e ficam no repositorio. O projeto
# Android e gerado pelo CI, entao os mipmaps saem de `dart run flutter_launcher_icons` la.
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "assets/icon/etiqueta_legacy.png"
  adaptive_icon_background: "assets/icon/etiqueta_bg.png"
  adaptive_icon_foreground: "assets/icon/etiqueta_fg.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/etiqueta_fg.png"
